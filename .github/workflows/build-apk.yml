name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Android project root
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./settings.gradle ] && [ -d ./app ]; then
            PROJECT_DIR="."
          elif [ -f ./projectile-lab-android/settings.gradle ] && [ -d ./projectile-lab-android/app ]; then
            PROJECT_DIR="./projectile-lab-android"
          else
            PROJECT_DIR="$(find . -maxdepth 3 -name settings.gradle -type f -print -quit | xargs -r dirname)"
          fi
          if [ -z "${PROJECT_DIR:-}" ] || [ ! -f "$PROJECT_DIR/settings.gradle" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "Could not find Android Gradle project root."
            find . -maxdepth 4 -type f \( -name settings.gradle -o -name build.gradle \) -print
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project root: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Make Gradle launcher executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: projectile-lab-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
